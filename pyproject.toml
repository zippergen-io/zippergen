[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zippergen"
version = "0.1.0a2"
description = "Python DSL and runtime for structured multi-agent coordination"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "The ZipperGen Authors" }
]
keywords = ["agents", "llm", "coordination", "protocols", "msc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No runtime dependencies. The only one, prompt-toolkit, existed for the
# interactive Studio shell and went with it.
dependencies = []

[project.optional-dependencies]
google = [
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/zippergen-io/zippergen"
Repository = "https://github.com/zippergen-io/zippergen"

[project.scripts]
zippergen = "zippergen.serve:main"
# Short form. The commands you type most are the ones worth shortening.
zg = "zippergen.serve:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zippergen*"]

# The coding-agent skill ships with the package. Without this, `pip install
# zippergen` gives you a runtime with no instructions for an agent, and the
# skill is reachable only from a git checkout.
[tool.setuptools.package-data]
zippergen = ["skills/**/*.md", "skills/**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]

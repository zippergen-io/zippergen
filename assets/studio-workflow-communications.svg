<svg xmlns="http://www.w3.org/2000/svg" role="img"
  aria-labelledby="title description" width="876" height="404"
  viewBox="0 0 876 404" preserveAspectRatio="xMinYMin meet">
  <title id="title">ZipperGen Studio communication-only workflow view</title>
  <desc id="description">Real ZipperGen Studio terminal output.</desc>
  <style>
    .background { fill: #f6f8fa; stroke: #d0d7de; }
    text { fill: #1f2328; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .banner { fill: #0969da; }
    .success { fill: #1a7f37; }
    .warning { fill: #9a6700; }
    .error { fill: #cf222e; }
    .pointer { fill: #8250df; font-weight: 700; }
    .comment { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; stroke: #30363d; }
      text { fill: #e6edf3; }
      .banner { fill: #58a6ff; }
      .success { fill: #3fb950; }
      .warning { fill: #d29922; }
      .error { fill: #f85149; }
      .pointer { fill: #d2a8ff; }
      .comment { fill: #8b949e; }
    }
  </style>
  <rect class="background" x="0.5" y="0.5" width="875"
    height="403" rx="8"/>
  <text class="banner" x="18" y="36" xml:space="preserve">╭──────────────────────────────────────────────────────────╮</text>
<text class="banner" x="18" y="56" xml:space="preserve">│ ZipperGen Studio · workflow show                         │</text>
<text class="banner" x="18" y="76" xml:space="preserve">╰──────────────────────────────────────────────────────────╯</text>
<text class="text" x="18" y="96" xml:space="preserve">Workflow view · tutorial_review · communications</text>
<text class="text" x="18" y="116" xml:space="preserve">════════════════════════════════════════════════</text>
<text class="text" x="18" y="136" xml:space="preserve">@workflow</text>
<text class="text" x="18" y="156" xml:space="preserve">def tutorial_review(request: str @ Requester, max_retries: int @ Requester) -&gt; str:</text>
<text class="text" x="18" y="176" xml:space="preserve">    Requester(request) &gt;&gt; Writer(request)</text>
<text class="text" x="18" y="196" xml:space="preserve">    Requester(max_retries) &gt;&gt; Reviewer(max_retries)</text>
<text class="text" x="18" y="216" xml:space="preserve">    Writer(draft) &gt;&gt; Reviewer(draft)</text>
<text class="text" x="18" y="236" xml:space="preserve">    while (not approved and retries &lt; max_retries) @ Reviewer:</text>
<text class="text" x="18" y="256" xml:space="preserve">        Reviewer(draft) &gt;&gt; Writer(draft)</text>
<text class="text" x="18" y="276" xml:space="preserve">        Writer(draft) &gt;&gt; Reviewer(draft)</text>
<text class="text" x="18" y="296" xml:space="preserve">    if (approved) @ Reviewer:</text>
<text class="text" x="18" y="316" xml:space="preserve">        Reviewer(draft) &gt;&gt; Requester(draft)</text>
<text class="text" x="18" y="336" xml:space="preserve">    else:</text>
<text class="text" x="18" y="356" xml:space="preserve">        Reviewer(failure) &gt;&gt; Requester(draft)</text>
<text class="text" x="18" y="376" xml:space="preserve">    return draft @ Requester</text>
</svg>

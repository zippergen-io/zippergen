<svg xmlns="http://www.w3.org/2000/svg" role="img"
  aria-labelledby="title description" viewBox="0 0 876 464">
  <title id="title">ZipperGen Studio deployment state</title>
  <desc id="description">Real ZipperGen Studio terminal output.</desc>
  <style>
    .background { fill: #f6f8fa; stroke: #d0d7de; }
    text { fill: #1f2328; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .banner { fill: #0969da; }
    .success { fill: #1a7f37; }
    .warning { fill: #9a6700; }
    .error { fill: #cf222e; }
    .pointer { fill: #8250df; font-weight: 700; }
    .comment { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; stroke: #30363d; }
      text { fill: #e6edf3; }
      .banner { fill: #58a6ff; }
      .success { fill: #3fb950; }
      .warning { fill: #d29922; }
      .error { fill: #f85149; }
      .pointer { fill: #d2a8ff; }
      .comment { fill: #8b949e; }
    }
  </style>
  <rect class="background" x="0.5" y="0.5" width="875"
    height="463" rx="8"/>

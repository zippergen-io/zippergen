<text class="text" x="18" y="476" xml:space="preserve"></text>
<text class="text" x="18" y="496" xml:space="preserve"></text>
<text class="text" x="18" y="516" xml:space="preserve">Reviewer · live local projection</text>
<text class="text" x="18" y="536" xml:space="preserve">────────────────────────────────</text>
<text class="comment" x="18" y="556" xml:space="preserve"># Live local projection for Reviewer; read-only observation.</text>
<text class="pointer" x="18" y="576" xml:space="preserve"># ▶ marks the current durable program position.</text>
<text class="text" x="18" y="596" xml:space="preserve"></text>
<text class="text" x="18" y="616" xml:space="preserve">  @role(&#x27;Reviewer&#x27;)</text>
<text class="text" x="18" y="636" xml:space="preserve">  def tutorial_review__Reviewer() -&gt; None:</text>
<text class="text" x="18" y="656" xml:space="preserve">      max_retries = recv(&#x27;Requester&#x27;)</text>
<text class="text" x="18" y="676" xml:space="preserve">      draft = recv(&#x27;Writer&#x27;)</text>
<text class="text" x="18" y="696" xml:space="preserve">      concerns = assess_draft(draft)</text>
<text class="text" x="18" y="716" xml:space="preserve">      retries = begin_retries()</text>
<text class="pointer" x="18" y="736" xml:space="preserve">▶     approved = approve_reply(draft, concerns)</text>
<text class="text" x="18" y="756" xml:space="preserve">      while not approved and retries &lt; max_retries:</text>
<text class="text" x="18" y="776" xml:space="preserve">          send_decision(&#x27;Writer&#x27;, True)</text>
<text class="text" x="18" y="796" xml:space="preserve">          retries = increment_retries(retries)</text>
<text class="text" x="18" y="816" xml:space="preserve">          send(&#x27;Writer&#x27;, draft)</text>
<text class="text" x="18" y="836" xml:space="preserve">          draft = recv(&#x27;Writer&#x27;)</text>
<text class="text" x="18" y="856" xml:space="preserve">          concerns = assess_draft(draft)</text>
<text class="text" x="18" y="876" xml:space="preserve">          approved = approve_reply(draft, concerns)</text>
<text class="text" x="18" y="896" xml:space="preserve">      else:</text>
<text class="text" x="18" y="916" xml:space="preserve">          send_decision(&#x27;Writer&#x27;, False)</text>
<text class="text" x="18" y="936" xml:space="preserve">      if approved:</text>
<text class="text" x="18" y="956" xml:space="preserve">          send_decision(&#x27;Requester&#x27;, True)</text>
<text class="text" x="18" y="976" xml:space="preserve">          send(&#x27;Requester&#x27;, draft)</text>
<text class="text" x="18" y="996" xml:space="preserve">      else:</text>
<text class="text" x="18" y="1016" xml:space="preserve">          send_decision(&#x27;Requester&#x27;, False)</text>
<text class="text" x="18" y="1036" xml:space="preserve">          failure = review_exhausted(draft, max_retries)</text>
<text class="text" x="18" y="1056" xml:space="preserve">          send(&#x27;Requester&#x27;, failure)</text>
<text class="text" x="18" y="1076" xml:space="preserve">Next</text>
<text class="text" x="18" y="1096" xml:space="preserve">────</text>
<text class="text" x="18" y="1116" xml:space="preserve">  run inspect PARTICIPANT · runs · resume</text>

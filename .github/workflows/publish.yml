name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        run: >-
          python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          tag=os.environ['GITHUB_REF_NAME'].removeprefix('v');
          assert tag == version, f'release tag {tag!r} does not match package version {version!r}'"

      - run: pip install build twine

      - run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1

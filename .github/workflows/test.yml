name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e . pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  types:
    # A separate job with every importable integration installed. Pyright is
    # configured to inspect the project .venv, so create that environment
    # rather than relying on runner-global packages. This library deliberately
    # does not commit uv.lock; CI resolves the bounded project dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --extra google

      - name: Type-check
        run: uvx pyright

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke-test the wheel
        run: |
          python -m venv /tmp/zippergen-wheel-smoke
          /tmp/zippergen-wheel-smoke/bin/pip install dist/*.whl
          /tmp/zippergen-wheel-smoke/bin/zg --help
          /tmp/zippergen-wheel-smoke/bin/zg deploy --help

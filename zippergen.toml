# Visible, versionable ZipperGen project configuration.
schema_version = 2
name = "zippergen"
specification_file = "specification.md"
workflow_entry = "examples/call_intake.py:call_intake"

[providers.connections."google"]
"kind" = "google"

[connectors.configurations."inbox"]
"account" = "me"
"connection" = "google"
"kind" = "gmail"
"query" = "is:unread"

[connectors.configurations."records"]
"connection" = "google"
"kind" = "google-sheets"
"spreadsheet_id" = "1AbC"
"tab" = "Calls"

[configuration]
"max_retries" = 1
"request" = "Interrupt me"
